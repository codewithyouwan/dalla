[build]
  command = "pnpm build"
  publish = ".next"
  environment = { NODE_VERSION = "18.17.0" }

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[functions]]
  function = "api_generateResume"
  path = "/api/generateResume"
  memory = 2048
  maxDuration = 60

[[functions]]
  function = "api_serveResume"
  path = "/api/serveTemp/:sessionId"
  memory = 512
  maxDuration = 10